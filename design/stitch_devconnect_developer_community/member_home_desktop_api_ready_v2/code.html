<style>
        body {
            background-color: #F8FAFC; /* neutral-color */
        }
        
        .skeleton {
            background-color: #E2E8F0;
            border-radius: 4px;
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .5; }
        }

<body class="font-body-md text-text-main bg-background antialiased flex flex-col min-h-screen">
<!-- TopNavBar -->
<header class="sticky top-0 z-50 flex justify-between items-center w-full px-margin-desktop bg-surface/80 backdrop-blur-md border-b border-border-subtle dark:border-outline-variant py-4">
<div class="flex items-center gap-lg">
<div class="font-display-lg text-display-lg font-bold text-primary dark:text-primary-fixed tracking-tight">
                DevConnect
            </div>
<nav class="hidden md:flex gap-lg items-center ml-lg">
<a class="text-secondary dark:text-secondary-fixed-dim font-bold border-b-2 border-secondary pb-1 active:scale-95 transition-transform" href="#">Home</a>
<a class="text-text-muted dark:text-outline hover:text-secondary dark:hover:text-secondary-fixed hover:bg-surface-container-low dark:hover:bg-primary-container transition-colors px-2 py-1 rounded active:scale-95 transition-transform" href="#">Communities</a>
<a class="text-text-muted dark:text-outline hover:text-secondary dark:hover:text-secondary-fixed hover:bg-surface-container-low dark:hover:bg-primary-container transition-colors px-2 py-1 rounded active:scale-95 transition-transform" href="#">Events</a>
<a class="text-text-muted dark:text-outline hover:text-secondary dark:hover:text-secondary-fixed hover:bg-surface-container-low dark:hover:bg-primary-container transition-colors px-2 py-1 rounded active:scale-95 transition-transform" href="#">About</a>
</nav>
</div>
<div class="flex items-center gap-md">
<div class="relative hidden lg:block">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-text-muted text-sm">search</span>
<input class="pl-10 pr-4 py-2 border border-border-subtle rounded-lg bg-surface-container-lowest shadow-[inset_0_2px_4px_rgba(0,0,0,0.02)] focus:border-secondary focus:ring-2 focus:ring-secondary/20 focus:outline-none w-64 text-sm font-body-sm transition-all placeholder:text-text-muted text-text-main" placeholder="Search..." type="text">
</div>
<button class="p-2 text-text-muted hover:text-secondary hover:bg-surface-container-low rounded-full transition-colors active:scale-95 flex items-center justify-center h-10 w-10">
<span class="material-symbols-outlined">notifications</span>
</button>
<button class="p-2 text-text-muted hover:text-secondary hover:bg-surface-container-low rounded-full transition-colors active:scale-95 flex items-center justify-center h-10 w-10">
<span class="material-symbols-outlined">bookmark</span>
</button>
<button class="ml-2 h-10 w-10 rounded-full overflow-hidden border border-border-subtle bg-surface-container-high focus:outline-none focus:ring-2 focus:ring-secondary active:scale-95 transition-transform">
</button>
</div>
</header>
<div class="flex-1 max-w-[1440px] mx-auto w-full grid grid-cols-1 md:grid-cols-12 gap-lg p-margin-mobile md:p-margin-desktop relative">
<!-- Left Sidebar (SideNavBar Concept Adapted for Desktop Grid) -->
<aside class="hidden md:flex flex-col md:col-span-3 lg:col-span-3 gap-base sticky top-[100px] h-[calc(100vh-120px)] overflow-y-auto pr-md">
<div class="mb-md">
<div class="flex items-center gap-3 mb-1">
<div class="h-8 w-8 rounded bg-primary-container text-on-primary-container flex items-center justify-center font-bold">
                        {{user_initial}}
                    </div>
<div>
<h2 class="font-headline-lg text-headline-lg text-primary text-lg leading-tight">{{user_name}}</h2>
<p class="font-body-sm text-body-sm text-text-muted">Manage your feed</p>
</div>
</div>
</div>
<nav class="flex flex-col gap-1 font-label-mono text-label-mono">
<a class="flex items-center gap-3 p-3 text-text-main dark:text-on-surface hover:bg-surface-container-high dark:hover:bg-surface-container-highest transition-all rounded-lg active:opacity-80" href="#">
<span class="material-symbols-outlined text-lg">group</span>
                    My Communities
                </a>
<a class="flex items-center gap-3 p-3 text-text-main dark:text-on-surface hover:bg-surface-container-high dark:hover:bg-surface-container-highest transition-all rounded-lg active:opacity-80" href="#">
<span class="material-symbols-outlined text-lg">bookmark</span>
                    Saved Posts
                </a>
<a class="flex items-center gap-3 p-3 text-text-main dark:text-on-surface hover:bg-surface-container-high dark:hover:bg-surface-container-highest transition-all rounded-lg active:opacity-80" href="#">
<span class="material-symbols-outlined text-lg">hub</span>
                    Subscribed Groups
                </a>
<a class="flex items-center gap-3 p-3 text-text-main dark:text-on-surface hover:bg-surface-container-high dark:hover:bg-surface-container-highest transition-all rounded-lg active:opacity-80" href="#">
<span class="material-symbols-outlined text-lg">event</span>
                    Event Reminders
                </a>
</nav>
<div class="mt-auto pt-lg border-t border-border-subtle">
<button class="w-full bg-secondary text-white font-body-sm font-semibold py-2 px-4 rounded-lg hover:bg-secondary/90 transition-colors active:scale-95 shadow-sm">
                    Create Post
                </button>
<nav class="flex flex-col gap-1 mt-4 font-label-mono text-label-mono">
<a class="flex items-center gap-3 p-2 text-text-muted hover:text-text-main transition-colors rounded-lg" href="#">
<span class="material-symbols-outlined text-lg">settings</span>
                        Settings
                    </a>
<a class="flex items-center gap-3 p-2 text-text-muted hover:text-text-main transition-colors rounded-lg" href="#">
<span class="material-symbols-outlined text-lg">help</span>
                        Help
                    </a>
</nav>
</div>
</aside>
<!-- Center Feed -->
<main class="col-span-1 md:col-span-9 lg:col-span-6 flex flex-col gap-lg">
<!-- Post Composer -->
<div class="bg-surface-container-lowest border border-border-subtle rounded-xl p-md shadow-sm">
<div class="flex gap-3">
<div class="h-10 w-10 rounded-full bg-surface-container-high border border-border-subtle flex-shrink-0"></div>
<div class="flex-1">
<textarea class="w-full bg-transparent border-none resize-none focus:ring-0 p-0 font-body-md text-text-main placeholder:text-text-muted min-h-[60px]" placeholder="Share your latest build, question, or thought..." rows="2"></textarea>
</div>
</div>
<div class="flex justify-between items-center mt-3 pt-3 border-t border-border-subtle">
<div class="flex gap-1">
<button class="p-2 text-text-muted hover:text-secondary hover:bg-surface-container-low rounded transition-colors" title="Attach Code Snippet">
<span class="material-symbols-outlined">code</span>
</button>
<button class="p-2 text-text-muted hover:text-secondary hover:bg-surface-container-low rounded transition-colors" title="Attach Image">
<span class="material-symbols-outlined">image</span>
</button>
<button class="p-2 text-text-muted hover:text-secondary hover:bg-surface-container-low rounded transition-colors" title="Tag Tech">
<span class="material-symbols-outlined">sell</span>
</button>
</div>
<button class="bg-secondary text-white font-body-sm font-semibold py-1.5 px-4 rounded-lg hover:bg-secondary/90 transition-colors active:scale-95 shadow-sm">
                        Post
                    </button>
</div>
</div>
<!-- Feed Tabs -->
<div class="flex gap-4 border-b border-border-subtle font-body-sm font-semibold">
<button class="pb-2 border-b-2 border-secondary text-secondary">Following</button>
<button class="pb-2 border-b-2 border-transparent text-text-muted hover:text-text-main transition-colors">Global</button>
<button class="pb-2 border-b-2 border-transparent text-text-muted hover:text-text-main transition-colors flex items-center gap-1">
<span class="material-symbols-outlined text-sm">trending_up</span> Trending
                </button>
</div>
<!-- Post Cards Stream (Loading State) -->
<div class="flex flex-col gap-md" data-bind="foreach: posts">
<!-- Skeleton Post Card 1 -->
<article class="bg-surface-container-lowest border border-border-subtle rounded-xl p-md shadow-sm">
<header class="flex items-start justify-between mb-3">
<div class="flex items-center gap-3 w-full">
<div class="h-10 w-10 rounded-full skeleton flex-shrink-0"></div>
<div class="flex flex-col gap-2 w-full max-w-[200px]">
<div class="h-4 skeleton w-3/4"></div>
<div class="h-3 skeleton w-1/2"></div>
</div>
</div>
</header>
<div class="mb-3 flex flex-col gap-2">
<div class="h-5 skeleton w-5/6 mb-2"></div>
<div class="h-4 skeleton w-full"></div>
<div class="h-4 skeleton w-full"></div>
<div class="h-4 skeleton w-2/3"></div>
<div class="flex flex-wrap gap-2 mt-3">
<div class="h-5 skeleton w-12 rounded"></div>
<div class="h-5 skeleton w-16 rounded"></div>
<div class="h-5 skeleton w-14 rounded"></div>
</div>
</div>
<footer class="flex items-center gap-3 border-t border-border-subtle pt-2">
<div class="h-8 skeleton w-16 rounded"></div>
<div class="h-8 skeleton w-16 rounded"></div>
</footer>
</article>
<!-- Skeleton Post Card 2 -->
<article class="bg-surface-container-lowest border border-border-subtle rounded-xl p-md shadow-sm">
<header class="flex items-start justify-between mb-3">
<div class="flex items-center gap-3 w-full">
<div class="h-10 w-10 rounded-full skeleton flex-shrink-0"></div>
<div class="flex flex-col gap-2 w-full max-w-[200px]">
<div class="h-4 skeleton w-2/3"></div>
<div class="h-3 skeleton w-1/3"></div>
</div>
</div>
</header>
<div class="mb-3 flex flex-col gap-2">
<div class="h-5 skeleton w-3/4 mb-2"></div>
<div class="h-4 skeleton w-full"></div>
<div class="h-4 skeleton w-5/6"></div>
<div class="h-24 skeleton w-full rounded-lg mt-2"></div>
</div>
<footer class="flex items-center gap-3 border-t border-border-subtle pt-2">
<div class="h-8 skeleton w-16 rounded"></div>
<div class="h-8 skeleton w-16 rounded"></div>
</footer>
</article>
</div>
<div class="py-4 text-center">
<button class="text-secondary font-body-sm font-semibold hover:underline" disabled="">Loading more...</button>
</div>
</main>
<!-- Right Sidebar (Contextual Discovery) -->
<aside class="hidden lg:flex flex-col col-span-3 gap-lg sticky top-[100px] h-[calc(100vh-120px)] overflow-y-auto pl-md">
<!-- Announcements Skeleton -->
<div class="bg-surface-container-lowest border border-border-subtle rounded-xl p-md shadow-sm">
<h3 class="font-title-md text-title-md text-sm mb-3 flex items-center gap-2 text-text-main">
<span class="material-symbols-outlined text-text-muted text-lg">campaign</span>
                    Announcements
                </h3>
<ul class="flex flex-col gap-4">
<li class="flex flex-col gap-2">
<div class="h-4 skeleton w-full"></div>
<div class="h-3 skeleton w-1/4"></div>
</li>
<li class="flex flex-col gap-2">
<div class="h-4 skeleton w-5/6"></div>
<div class="h-3 skeleton w-1/3"></div>
</li>
</ul>
</div>
<!-- Upcoming Events Skeleton -->
<div class="bg-surface-container-lowest border border-border-subtle rounded-xl p-md shadow-sm">
<div class="flex justify-between items-center mb-3">
<h3 class="font-title-md text-title-md text-sm text-text-main">Upcoming Events</h3>
<div class="h-3 skeleton w-12"></div>
</div>
<div class="flex flex-col gap-4">
<div class="flex gap-3 items-start">
<div class="h-12 w-12 skeleton rounded flex-shrink-0"></div>
<div class="flex flex-col gap-2 w-full mt-1">
<div class="h-4 skeleton w-3/4"></div>
<div class="h-3 skeleton w-1/2"></div>
</div>
</div>
<div class="flex gap-3 items-start">
<div class="h-12 w-12 skeleton rounded flex-shrink-0"></div>
<div class="flex flex-col gap-2 w-full mt-1">
<div class="h-4 skeleton w-5/6"></div>
<div class="h-3 skeleton w-2/3"></div>
</div>
</div>
</div>
</div>
<!-- Top Contributors Skeleton -->
<div class="bg-surface-container-lowest border border-border-subtle rounded-xl p-md shadow-sm">
<h3 class="font-title-md text-title-md text-sm mb-3 text-text-main">Top Contributors</h3>
<div class="flex flex-col gap-3">
<div class="flex items-center justify-between">
<div class="flex items-center gap-2">
<div class="h-8 w-8 rounded-full skeleton"></div>
<div class="h-4 skeleton w-20"></div>
</div>
<div class="h-4 skeleton w-12 rounded"></div>
</div>
<div class="flex items-center justify-between">
<div class="flex items-center gap-2">
<div class="h-8 w-8 rounded-full skeleton"></div>
<div class="h-4 skeleton w-16"></div>
</div>
<div class="h-4 skeleton w-12 rounded"></div>
</div>
</div>
</div>
</aside>
</div>
</body></html>
