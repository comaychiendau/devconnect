<body class="bg-surface text-text-main font-body-md min-h-screen flex items-center justify-center p-md">
<main class="w-full max-w-md bg-surface-container-lowest border border-border-subtle rounded-xl shadow-[0px_4px_12px_rgba(0,0,0,0.05)] p-xl overflow-hidden relative">
<!-- Background Pattern -->
<div class="absolute inset-0 pointer-events-none opacity-10 bg-[radial-gradient(#e2e8f0_1px,transparent_1px)] [background-size:16px_16px]"></div>
<div class="relative z-10 flex flex-col items-center mb-lg">
<h1 class="font-display-lg text-display-lg font-bold text-primary mb-xs">DevConnect</h1>
<p class="font-body-sm text-body-sm text-text-muted">Welcome back, Developer.</p>
</div>
<form class="relative z-10 flex flex-col gap-md" onsubmit="event.preventDefault();">
<div class="flex flex-col gap-xs">
<label class="font-label-mono text-label-mono text-text-main" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-text-muted">mail</span>
<input class="w-full pl-10 pr-3 py-2 bg-surface border border-border-subtle rounded-lg font-body-sm text-body-sm text-text-main placeholder-text-muted focus:outline-none focus:border-secondary focus:ring-2 focus:ring-secondary/20 transition-all shadow-inner" id="email" name="email" placeholder="dev@example.com" required="" type="email">
</div>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-mono text-label-mono text-text-main" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-text-muted">lock</span>
<input class="w-full pl-10 pr-10 py-2 bg-surface border border-border-subtle rounded-lg font-body-sm text-body-sm text-text-main placeholder-text-muted focus:outline-none focus:border-secondary focus:ring-2 focus:ring-secondary/20 transition-all shadow-inner" id="password" name="password" placeholder="••••••••" required="" type="password">
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-text-muted hover:text-secondary transition-colors" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined text-[20px]" id="visibility-icon">visibility</span>
</button>
</div>
<div class="flex justify-end mt-1">
<a class="font-body-sm text-body-sm text-secondary hover:underline" href="#">Forgot password?</a>
</div>
</div>
<button class="w-full bg-secondary text-on-secondary font-title-md text-title-md py-3 rounded-lg hover:bg-secondary/90 transition-colors mt-sm flex items-center justify-center gap-2" type="submit">
                Sign In
                <span class="material-symbols-outlined">login</span>
</button>
</form>
<div class="relative z-10 flex items-center gap-sm my-lg">
<div class="flex-1 h-px bg-border-subtle"></div>
<span class="font-label-mono text-label-mono text-text-muted uppercase">Or continue with</span>
<div class="flex-1 h-px bg-border-subtle"></div>
</div>
<div class="relative z-10 flex gap-md justify-center mb-lg">
<button class="w-12 h-12 flex items-center justify-center bg-surface border border-border-subtle rounded-lg hover:bg-surface-container-low hover:border-secondary transition-all">
<span class="material-symbols-outlined text-text-main">code</span>
</button>
<button class="w-12 h-12 flex items-center justify-center bg-surface border border-border-subtle rounded-lg hover:bg-surface-container-low hover:border-secondary transition-all">
<span class="material-symbols-outlined text-text-main">public</span>
</button>
</div>
<div class="relative z-10 text-center">
<p class="font-body-sm text-body-sm text-text-muted">
                New to DevConnect? 
                <a class="text-secondary font-semibold hover:underline" href="#">Create an account</a>
</p>
</div>
</main>
<script>
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const visibilityIcon = document.getElementById('visibility-icon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                visibilityIcon.textContent = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                visibilityIcon.textContent = 'visibility';
            }
        }
    </script>
