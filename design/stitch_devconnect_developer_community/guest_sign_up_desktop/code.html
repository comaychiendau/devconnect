<style type="text/tailwindcss">
        @layer utilities {
            .input-field {
                @apply w-full px-md py-sm bg-surface-container-lowest border border-border-subtle rounded-DEFAULT shadow-inner text-text-main font-body-md transition-all duration-200 outline-none;
            }
            .input-field:focus {
                @apply border-secondary ring-2 ring-secondary/20;
            }
            .btn-primary {
                @apply w-full flex items-center justify-center bg-secondary hover:bg-secondary-container text-on-secondary font-title-md py-md rounded-lg transition-colors duration-200;
            }
            .btn-social {
                @apply w-full flex items-center justify-center gap-sm bg-surface-container-lowest border border-border-subtle hover:bg-surface-container-low text-text-main font-body-md py-sm rounded-DEFAULT transition-colors duration-200;
            }
        }

<body class="bg-background min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop font-body-md text-text-main antialiased">
<!-- Main Container -->
<main class="w-full max-w-[480px] bg-surface-container-lowest rounded-xl border border-border-subtle shadow-sm overflow-hidden flex flex-col relative z-10">
<!-- Header -->
<header class="p-xl pb-md text-center flex flex-col items-center border-b border-border-subtle bg-surface/50">
<div class="flex items-center gap-sm mb-md">
<span class="material-symbols-outlined text-primary text-[32px] font-bold" data-icon="terminal">terminal</span>
<h1 class="font-display-lg text-display-lg text-primary tracking-tight">DevConnect</h1>
</div>
<h2 class="font-title-md text-title-md text-text-main mb-xs">Create your account</h2>
<p class="font-body-md text-body-md text-text-muted">Join the community of developers and engineers.</p>
</header>
<!-- Form Area -->
<div class="p-xl flex-1 flex flex-col gap-lg">
<form action="#" class="flex flex-col gap-md" method="POST">
<!-- Full Name -->
<div class="flex flex-col gap-xs">
<label class="font-label-mono text-label-mono text-text-muted uppercase" for="fullName">Full Name</label>
<input class="input-field" id="fullName" name="fullName" placeholder="Ada Lovelace" required="" type="text">
</div>
<!-- Email -->
<div class="flex flex-col gap-xs">
<label class="font-label-mono text-label-mono text-text-muted uppercase" for="email">Email Address</label>
<input class="input-field" id="email" name="email" placeholder="ada@example.com" required="" type="email">
</div>
<!-- Username -->
<div class="flex flex-col gap-xs">
<label class="font-label-mono text-label-mono text-text-muted uppercase" for="username">Username</label>
<div class="relative flex items-center">
<span class="absolute left-md text-text-muted font-code-snippet">@</span>
<input class="input-field pl-xl" id="username" name="username" placeholder="adalovelace" required="" type="text">
</div>
</div>
<!-- Password -->
<div class="flex flex-col gap-xs">
<label class="font-label-mono text-label-mono text-text-muted uppercase" for="password">Password</label>
<div class="relative flex items-center">
<input class="input-field pr-xl" id="password" name="password" placeholder="••••••••" required="" type="password">
<button aria-label="Toggle password visibility" class="absolute right-md text-text-muted hover:text-text-main transition-colors" onclick="togglePassword('password', 'pwd-icon-1')" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility_off" id="pwd-icon-1">visibility_off</span>
</button>
</div>
</div>
<!-- Confirm Password -->
<div class="flex flex-col gap-xs">
<label class="font-label-mono text-label-mono text-text-muted uppercase" for="confirmPassword">Confirm Password</label>
<div class="relative flex items-center">
<input class="input-field pr-xl" id="confirmPassword" name="confirmPassword" placeholder="••••••••" required="" type="password">
<button aria-label="Toggle password visibility" class="absolute right-md text-text-muted hover:text-text-main transition-colors" onclick="togglePassword('confirmPassword', 'pwd-icon-2')" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility_off" id="pwd-icon-2">visibility_off</span>
</button>
</div>
</div>
<!-- Submit Button -->
<div class="pt-sm">
<button class="btn-primary" type="submit">
                        Sign Up
                    </button>
</div>
</form>
<!-- Divider -->
<div class="flex items-center gap-md py-sm">
<div class="h-px bg-border-subtle flex-1"></div>
<span class="font-label-mono text-label-mono text-text-muted uppercase">Or continue with</span>
<div class="h-px bg-border-subtle flex-1"></div>
</div>
<!-- Social Logins -->
<div class="flex flex-col sm:flex-row gap-sm">
<button class="btn-social" type="button">
<svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">

</svg>
                    GitHub
                </button>
<button class="btn-social" type="button">
<svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
<path d="M12.48 10.92v3.28h7.84c-.24 1.84-.853 3.187-1.787 4.133-1.147 1.147-2.933 2.4-6.053 2.4-4.827 0-8.6-3.893-8.6-8.72s3.773-8.72 8.6-8.72c2.6 0 4.507 1.027 5.907 2.347l2.307-2.307C18.747 1.44 16.133 0 12.48 0 5.867 0 .307 5.387.307 12s5.56 12 12.173 12c3.573 0 6.267-1.173 8.373-3.36 2.16-2.16 2.84-5.213 2.84-7.667 0-.76-.053-1.467-.173-2.053H12.48z"></path>
</svg>
                    Google
                </button>
</div>
</div>
<!-- Footer -->
<footer class="p-md bg-surface border-t border-border-subtle text-center">
<p class="font-body-sm text-body-sm text-text-muted">
                Already have an account? 
                <a class="text-secondary font-medium hover:underline transition-all" href="#">Log in</a>
</p>
</footer>
</main>
<!-- Decorative Background Elements (Atmospheric) -->
<div class="fixed top-0 left-0 w-full h-full overflow-hidden pointer-events-none -z-10">
<div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] rounded-full bg-secondary/5 blur-[120px]"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[50%] h-[50%] rounded-full bg-primary/5 blur-[150px]"></div>
</div>
<script>
        // Simple password toggle logic
        function togglePassword(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = 'visibility';
            } else {
                input.type = 'password';
                icon.textContent = 'visibility_off';
            }
        }
    </script>
</body></html>
